name: ECHO Linux packages
on:
  push:
    branches: [main]
    paths: ['.github/workflows/linux-packages.yml', 'native/**', 'tests/fps_*', 'tests/fixtures/**', 'tests/test-fps-unlock.sh', 'tests/test-steam-*.sh']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to upload packages to'
        required: false
        default: 'v0.3.5-2'
        type: string
permissions:
  contents: write
jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config qt6-base-dev qt6-base-dev-tools libsqlite3-dev libxxhash-dev libasound2-dev libpulse-dev libudev-dev libgl1-mesa-dev libx11-dev libxext-dev libxcursor-dev libxi-dev libxrandr-dev libxss-dev libwayland-dev libxkbcommon-dev libfuse2 patchelf xvfb xauth
      - name: Build SDL3
        run: |
          curl -fsSL https://github.com/libsdl-org/SDL/releases/download/release-3.2.22/SDL3-3.2.22.tar.gz -o /tmp/sdl.tar.gz
          tar -xzf /tmp/sdl.tar.gz -C /tmp
          cmake -S /tmp/SDL3-3.2.22 -B /tmp/sdl-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSDL_TEST_LIBRARY=OFF -DSDL_TESTS=OFF
          cmake --build /tmp/sdl-build -j2
          sudo cmake --install /tmp/sdl-build
          sudo ldconfig
      - name: Build and test ECHO
        run: |
          cmake -S native -B build/linux -DCMAKE_BUILD_TYPE=Release
          cmake --build build/linux -j2
          for test in smoke ui controller installer launch auto-install manifest download; do
            QT_QPA_PLATFORM=offscreen build/linux/echo-native --"$test"-test
          done
          ECHO_NATIVE_TEST_BINARY="$PWD/build/linux/echo-native" bash tests/test-steam-wrap.sh
          bash tests/test-fps-unlock.sh
      - name: Build and test AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          QMAKE: /usr/bin/qmake6
          LD_LIBRARY_PATH: /usr/local/lib
          OUTPUT: ECHO-Native-0.3.5-x86_64.AppImage
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage -o linuxdeploy
          curl -fsSL https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage -o linuxdeploy-plugin-qt
          chmod +x linuxdeploy linuxdeploy-plugin-qt
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/scalable/apps AppDir/usr/plugins/platforms
          install -m755 /usr/lib/x86_64-linux-gnu/qt6/plugins/platforms/libqoffscreen.so AppDir/usr/plugins/platforms/libqoffscreen.so
          install -m755 build/linux/echo-native AppDir/usr/bin/echo-native
          install -m644 packaging/echo-native.desktop AppDir/usr/share/applications/echo-native.desktop
          install -m644 packaging/echo-native.svg AppDir/usr/share/icons/hicolor/scalable/apps/echo-native.svg
          ./linuxdeploy --appdir AppDir --desktop-file AppDir/usr/share/applications/echo-native.desktop --icon-file AppDir/usr/share/icons/hicolor/scalable/apps/echo-native.svg --plugin qt --output appimage
          test -f "$OUTPUT"
          QT_QPA_PLATFORM=xcb xvfb-run -a ./"$OUTPUT" --smoke-test
          QT_QPA_PLATFORM=offscreen ./"$OUTPUT" --controller-test
      - name: Build DEB package
        run: |
          set -euo pipefail
          mkdir -p deb/DEBIAN deb/opt/echo-native deb/usr/bin deb/usr/share/applications deb/usr/share/icons/hicolor/scalable/apps
          install -m755 ECHO-Native-0.3.5-x86_64.AppImage deb/opt/echo-native/ECHO-Native.AppImage
          printf '#!/bin/sh\nexport APPIMAGE_EXTRACT_AND_RUN=1\nexec /opt/echo-native/ECHO-Native.AppImage "$@"\n' > deb/usr/bin/echo-native
          chmod 755 deb/usr/bin/echo-native
          install -m644 packaging/echo-native.desktop deb/usr/share/applications/echo-native.desktop
          install -m644 packaging/echo-native.svg deb/usr/share/icons/hicolor/scalable/apps/echo-native.svg
          cp packaging/echo-native.install deb/DEBIAN/postinst
          printf '\n_refresh_echo_desktop\n' >> deb/DEBIAN/postinst
          chmod 755 deb/DEBIAN/postinst
          printf 'Package: echo-native\nVersion: 0.3.5\nArchitecture: amd64\nMaintainer: ECHO Native\nDepends: libc6 (>= 2.35), libstdc++6\nSection: utils\nPriority: optional\nDescription: Wuthering Waves Russian translation launcher\n' > deb/DEBIAN/control
          dpkg-deb --build --root-owner-group deb echo-native_0.3.5_amd64.deb
          dpkg-deb --info echo-native_0.3.5_amd64.deb
      - name: Add packages to existing release
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || 'v0.3.5-2' }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" ECHO-Native-0.3.5-x86_64.AppImage echo-native_0.3.5_amd64.deb --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" ECHO-Native-0.3.5-x86_64.AppImage echo-native_0.3.5_amd64.deb --target "$GITHUB_SHA" --title "ECHO Native ${RELEASE_TAG#v}" --notes "Поддержка прямого и Steam-запуска (--steam-wrap-direct, ECHO_DIRECT=1) с проверкой и восстановлением установки перед стартом, а также восстановлением монтирования при запуске. Добавлена проверка SHA-1 при атомарном копировании файлов, улучшено определение процесса игры в Wine и исправлены ошибки совместимости с Qt 6.2 и отключения геймпада." --repo "$GITHUB_REPOSITORY"
          fi


