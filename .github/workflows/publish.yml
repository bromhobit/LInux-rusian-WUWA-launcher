name: Publish package

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish.yml'
      - 'release/echo-native-0.2.2-1-x86_64.pkg.tar.zst'
      - 'release/SHA256SUMS'
      - 'packaging/Dockerfile.oci'
      - 'docs/RELEASE-NOTES.md'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  publish:
    name: Publish GitHub Package and Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify installation package
        run: cd release && sha256sum --check SHA256SUMS

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v0.2.2 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v0.2.2 release/echo-native-0.2.2-1-x86_64.pkg.tar.zst release/SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create v0.2.2 release/echo-native-0.2.2-1-x86_64.pkg.tar.zst release/SHA256SUMS --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "ECHO Native 0.2.2" --notes-file docs/RELEASE-NOTES.md
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish package to GitHub Packages
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/Dockerfile.oci
          push: true
          tags: |
            ghcr.io/bromhobit/echo-native:0.2.2-1
            ghcr.io/bromhobit/echo-native:latest
