name: Publish package

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish.yml'
      - 'release/**'
      - 'packaging/Dockerfile.oci'
      - 'docs/RELEASE-NOTES.md'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  publish:
    name: Publish GitHub Package and Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read package version
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^pkgver=//p' release/PKGBUILD)
          revision=$(sed -n 's/^pkgrel=//p' release/PKGBUILD)
          [[ "$version" =~ ^[0-9]+(\.[0-9]+)*$ && "$revision" =~ ^[0-9]+$ ]]
          package="echo-native-${version}-${revision}-x86_64.pkg.tar.zst"
          source="echo-native-source-${version}.tar.gz"
          test -f "release/$package"
          test -f "release/$source"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "package=$package" >> "$GITHUB_OUTPUT"
          echo "source=$source" >> "$GITHUB_OUTPUT"

      - name: Verify installation package
        run: cd release && sha256sum --check SHA256SUMS

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.package.outputs.version }}
          PACKAGE: ${{ steps.package.outputs.package }}
          SOURCE: ${{ steps.package.outputs.source }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v$VERSION"
          assets=("release/$PACKAGE" "release/$SOURCE" release/SHA256SUMS release/PKGBUILD)
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "ECHO Native $VERSION" --notes-file docs/RELEASE-NOTES.md
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish package to GitHub Packages
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/Dockerfile.oci
          push: true
          build-args: |
            PACKAGE_FILE=${{ steps.package.outputs.package }}
            VERSION=${{ steps.package.outputs.version }}
          tags: |
            ghcr.io/bromhobit/echo-native:${{ steps.package.outputs.version }}-${{ steps.package.outputs.revision }}
            ghcr.io/bromhobit/echo-native:latest
